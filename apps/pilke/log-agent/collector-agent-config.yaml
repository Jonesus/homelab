# The agent's pipeline, and the whole of its scope.
#
# ⚠️ EDITING THIS FILE CHANGES NOTHING UNTIL THE PODS ARE REPLACED. The
# DaemonSet mounts it as a file and reads it once at startup, and Argo does not
# roll a workload because a ConfigMap it mounts changed:
#
#     kubectl -n pilke-logs rollout restart ds/otel-collector-agent
#
# ⚠️ THE OTHER HALF OF THIS DESIGN IS IN `../observability/collector-config.yaml`
# and the two only make sense read together. The agent exports to the gateway
# rather than to a store, so the gateway's `redaction` processor is what covers
# container stdout — the one place PII actually leaks — and none of that is
# visible from this file. A reader who finds only this one sees a log shipper
# with no privacy defence at all.
#
# The name differs from the gateway's `otel-collector-config` on purpose. Two
# ConfigMaps with one name in two namespaces are one forgotten `-n` away from an
# edit that lands on the wrong pipeline and appears to do nothing.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-agent-config
  namespace: pilke-logs
data:
  agent.yaml: |
    receivers:
      filelog:
        # THIS GLOB IS THE SCOPE, and it is the only scope there is. Kubernetes
        # names the file <pod>_<namespace>_<container>-<id>.log, so a namespace
        # filter is a filename filter and it applies before a line is ever read.
        #
        # `_pilke_` is a literal with the separators included, which is also
        # what keeps this agent out of its own input: its pod's file is named
        # `..._pilke-logs_...` and does not match. ⚠️ A namespace whose name is
        # exactly `pilke` is the only thing this reads — anything wider is a
        # change to this line and to nothing else, so a widened glob is not
        # visible in a diff of any other file.
        include:
          - /var/log/containers/*_pilke_*.log
        exclude:
          # The gateway is in `pilke` and inside the glob above, so without this
          # the agent reads the gateway's log, ships it to the gateway, which
          # logs having received it — a loop bounded only by the rate limit. Its
          # logs are still there for `kubectl logs`, which is where you would
          # look for them anyway.
          - /var/log/containers/otel-collector-*_pilke_*.log

        # Everything already on disk when this starts is history that was never
        # collected, and replaying weeks of it on first sync would be the
        # store's first impression of itself.
        start_at: end

        # Where the read offsets live. Without it a restart re-reads from
        # `start_at` and loses whatever arrived while the pod was down.
        storage: file_storage

        include_file_path: true
        include_file_name: false
        retry_on_failure:
          enabled: true

        operators:
          # Unwraps the container runtime's envelope — the
          # `2026-08-22T… stdout F …` prefix that containerd and CRI-O write
          # around every line — and leaves the application's own line as the
          # body.
          #
          # `add_metadata_from_filepath: false` because this operator's path
          # regex only understands the /var/log/pods/ layout, and the glob above
          # is deliberately the /var/log/containers/ one. The next operator does
          # that job against the filename this DaemonSet actually reads.
          - type: container
            id: runtime-envelope
            add_metadata_from_filepath: false

          # Pod, namespace and container come out of the path with a regex.
          #
          # THE ALTERNATIVE IS THE k8sattributes PROCESSOR, WHICH READS THE SAME
          # THREE FACTS FROM THE KUBERNETES API and needs a ClusterRole to list
          # pods across namespaces to do it. This reads a filename. It holds no
          # Kubernetes permissions at all, which is as close as a DaemonSet gets
          # to being namespace-scoped.
          - type: regex_parser
            id: metadata-from-filename
            parse_from: attributes["log.file.path"]
            regex: '^/var/log/containers/(?P<pod>[^_]+)_(?P<namespace>[^_]+)_(?P<container>.+)-[0-9a-f]+\.log$'

          # Onto the resource, not the record: these describe where the line came
          # from rather than what it says, and the exporters' stream-field header
          # is what keeps them from each becoming a stream.
          - type: move
            from: attributes.pod
            to: resource["k8s.pod.name"]
          - type: move
            from: attributes.namespace
            to: resource["k8s.namespace.name"]
          - type: move
            from: attributes.container
            to: resource["k8s.container.name"]

          # In production the backend's console handler writes JSON, so the
          # fields are parsed rather than guessed at. The guard matters: the
          # migration Job, gunicorn's own startup lines and anything that
          # crashes before logging is configured are plain text, and a parser
          # that fails on them would drop exactly the lines you need when a pod
          # will not start.
          - type: json_parser
            id: application-json
            parse_from: body
            if: 'body matches "^\\s*\\{"'
            on_error: send


    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 25

      transform:
        error_mode: ignore
        log_statements:
          # ⚠️ `service.name` IS A STREAM FIELD, SO THE SET OF VALUES BELOW IS
          # THE STREAM COUNT. The gateway ships to VictoriaLogs with
          # `VL-Stream-Fields: service.name,deployment.environment` — the header
          # is in `../observability/collector-config.yaml`, not here — and a
          # stream in that store is permanent: every distinct value ever sent
          # stays in the index whether or not anything still writes it. So this
          # value comes from a closed set spelt out here and never from the
          # container name, which is open: the namespace holds Grafana,
          # VictoriaLogs and vmalert beside the application, and any `kubectl
          # run` debugging pod adds one more. A name derived from the container
          # mints a stream per throwaway pod that nothing can take back.
          #
          # A default first and then the three overrides. Statements run in
          # order, so the last one that matches wins and every container not
          # named below keeps the default — four literals in, at most four
          # values out, for any input.
          #
          # ⚠️ THE THREE LITERALS ARE THE `OTEL_SERVICE_NAME` VALUES ON
          # `../app/deployment-api.yaml`, `-worker` AND `-scheduler`. Traces
          # from those same processes arrive under those names and the
          # trace-to-logs click joins on `service.name`, so a spelling that
          # differs by one character makes one service look like two and the
          # click lands nowhere. Both sides change together or neither does.
          #
          # `pilke-other` and not `pilke-infra`, because a debugging pod lands
          # here too and is not infrastructure; the name has to stay true for
          # whatever turns up in the namespace. It costs no information: every
          # record still carries `k8s.container.name`, and the gateway's header
          # names two stream fields and not that one, so it arrives as an
          # ordinary field — free of cardinality cost and still filterable when
          # the question is which container a line came from.
          - set(resource.attributes["service.name"], "pilke-other")
          - set(resource.attributes["service.name"], "pilke-api") where resource.attributes["k8s.container.name"] == "api"
          - set(resource.attributes["service.name"], "pilke-worker") where resource.attributes["k8s.container.name"] == "worker"
          - set(resource.attributes["service.name"], "pilke-scheduler") where resource.attributes["k8s.container.name"] == "scheduler"
          # The second of the two stream fields. Constant here because this
          # cluster is the production one; it exists so the field is present and
          # low-cardinality rather than absent.
          - set(resource.attributes["deployment.environment"], "prod")

          # ⚠️ A log line must not be able to redefine its own stream. VictoriaLogs
          # reads an incoming field literally named `_stream` as the record's stream
          # definition, so a parsed body carrying one arrives beside the stream fields
          # set above, names the same tag twice, and the store refuses the record with
          # `cannot unmarshal StreamTags: stream tags must be sorted in alphabetical
          # order`. It drops the record and logs at panic level, so the symptom is a
          # hole in the record rather than an outage.
          #
          # Nothing this application logs carries such a key. What does is any
          # container in the namespace that prints a VictoriaLogs query result to
          # stdout -- an ordinary thing to do while debugging, and how this was found.
          #
          # It is done here rather than with a `remove` operator because the parsed
          # keys land in the body, not in attributes: json_parser reads `parse_from:
          # body` and writes back to the same place.
          #
          # `IsMap` is load-bearing. The parser leaves body a string for every line
          # that is not JSON, delete_key on a string is an error, and this processor
          # runs with error_mode: ignore -- so without the guard it would fail
          # silently on the majority of lines rather than loudly.
          - delete_key(log.body, "_stream") where IsMap(log.body)
          - delete_key(log.body, "_stream_id") where IsMap(log.body)
          - delete_key(log.body, "_time") where IsMap(log.body)
          - delete_key(log.body, "_msg") where IsMap(log.body)

      batch:
        send_batch_size: 1024
        timeout: 5s

    extensions:
      # A hostPath, unlike the gateway's: read offsets are per-node state and
      # they are the one thing here that must outlive the pod. Losing them
      # re-reads or skips a node's log tail.
      file_storage:
        directory: /var/lib/otelcol-agent

      health_check:
        endpoint: 0.0.0.0:13133

    exporters:
      # THROUGH THE GATEWAY, NOT STRAIGHT TO THE STORE. Container stdout is
      # where PII leaks in practice — a stray log of a response body puts
      # profiles and phone numbers on disk — so the agent's output goes through
      # the same `redaction` processor as everything else, and only the gateway
      # knows the stores' addresses.
      #
      # ⚠️ A CROSS-NAMESPACE ADDRESS, AND SO A FULLY QUALIFIED ONE. A bare
      # `otel-collector` resolves against this pod's own search domains, finds
      # no such Service in `pilke-logs`, and every export fails DNS — which
      # reads in the agent's log as the gateway being down. Nothing here may be
      # named `otel-collector` either: a local Service of that name would
      # resolve first and swallow the whole log stream.
      #
      # `logs_endpoint` with the full path here too, for the same reason as in
      # the gateway: the key that appends a path for you is the one that 404s.
      otlphttp/gateway:
        logs_endpoint: http://otel-collector.pilke.svc.cluster.local:4318/v1/logs
        sending_queue:
          enabled: true
          storage: file_storage
        retry_on_failure:
          enabled: true

    service:
      extensions: [file_storage, health_check]
      telemetry:
        logs:
          level: info
      pipelines:
        logs:
          receivers: [filelog]
          processors: [memory_limiter, transform, batch]
          exporters: [otlphttp/gateway]
