# ⚠️ THE ONLY PUBLIC SURFACE IN THIS STACK. Everything else under
# `observability/` is reachable from the LAN at most, so this one object is the
# whole of the attack surface telemetry adds, and it is referenced from
# `kustomization.yaml` only because both of the things that gate it hold:
#
#   1. The legal gate. Collecting from a tester's phone is defensible while the
#      published privacy statement describes error and performance telemetry —
#      *Virheet ja suorituskyky* / *Errors and diagnostics*, with a legitimate
#      interest and a 30-day retention the two stores enforce themselves. That
#      text is in `pilke-web` and nothing here can verify it; a change that
#      removes it is a reason to remove this file.
#   2. The collector requires an ingest key. `collector-config.yaml` carries a
#      `bearertokenauth` extension on a second OTLP receiver, and this Ingress
#      routes to that receiver's port and not to the open one — see the backend
#      at the bottom, which is the single line the whole property rests on.
#
# ⚠️ THE KEY IS OBFUSCATION AND NOT A SECRET. It ships inside the app's JS
# bundle, so everybody holding the APK holds it. It keeps a scanner from
# finding an open ingest and it can be rotated; it does not make this endpoint
# private, and the rate limits below are what actually bound abuse by somebody
# who has read the bundle.
#
# The endpoint is a path and not a hostname because an Ingress must live in its
# backend's namespace: the collector is in `pilke`, so telemetry goes to
# api.pilke.app on the certificate and DNS record already in place. nginx
# prefers the more specific path, so the API's own `/` is untouched.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pilke-otlp-ingress
  namespace: pilke
  annotations:
    # ⚠️ 1m, AND THIS IS WHY THIS IS ITS OWN INGRESS OBJECT. `pilke-ingress`
    # carries 10m because a phone-camera photograph through
    # POST /users/me/photo needs it. Telemetry must not inherit that cap, and
    # the photograph path must keep it — annotations are per-Ingress, so one
    # object for both hosts one of these two values and gets the other wrong.
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"

    # Per client address, and the failure mode being designed against is
    # somebody pointing a load generator at an ingest endpoint whose address is
    # in a public app bundle. The collector's `memory_limiter` is the second
    # line; this is the cheap one, and it refuses the request before it costs
    # anything.
    nginx.ingress.kubernetes.io/limit-rps: "5"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "3"
    nginx.ingress.kubernetes.io/limit-connections: "10"

    # The public path is /otlp/v1/traces; the collector's OTLP receiver serves
    # /v1/traces. A literal rewrite rather than a captured one, because exactly
    # one path is exposed and a capture group would be a way to reach the rest.
    nginx.ingress.kubernetes.io/rewrite-target: /v1/traces
spec:
  ingressClassName: nginx
  tls:
    # The certificate `pilke-ingress` already holds for this host, reused rather
    # than reissued: no `cert-manager.io/cluster-issuer` annotation here, because
    # two Ingress objects both claiming to manage one Secret is two Certificate
    # resources fighting over one name.
    - secretName: pilke-tls
      hosts:
        - api.pilke.app
  rules:
    - host: api.pilke.app
      http:
        paths:
          # ONLY THIS PATH. No /otlp/v1/logs — the app sends spans and the
          # DaemonSet reads the backend's stdout, so nothing outside the cluster
          # has a reason to write log records. The receiver behind this port is
          # in the traces pipeline alone, so `/v1/logs` there is a 404 as well:
          # two locks on the same door, because this is the one that a later
          # edit here could quietly unlock. And no OTLP/gRPC: the collector
          # listens on HTTP only, so there is nothing to expose.
          - path: /otlp/v1/traces
            pathType: Prefix
            backend:
              service:
                name: otel-collector
                # ⚠️ 4319, NOT 4318. 4319 is the receiver that requires the
                # bearer token; 4318 is the one the API, the worker, the
                # scheduler and the log agent use with no credential, because
                # a receiver's authenticator has no per-client exemption to
                # grant them. Both ports answer `/v1/traces` identically to a
                # request that carries the key, so 4318 here would look like a
                # working ingest and be an open one.
                port:
                  number: 4319
