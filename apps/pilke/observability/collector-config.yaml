# Both collector pipelines, in one ConfigMap because they are one design and
# reading them side by side is how you see that the agent's output goes through
# the gateway's redaction rather than around it.
#
# ⚠️ EDITING THIS FILE CHANGES NOTHING UNTIL THE PODS ARE REPLACED. Both
# workloads mount it as a file and read it once at startup, and Argo does not
# roll a workload because a ConfigMap it mounts changed. The same footgun as
# `prerequisites/configmap.yaml`, and the opposite of the alert rules beside it,
# which vmalert reloads on its own:
#
#     kubectl -n pilke rollout restart deploy/otel-collector ds/otel-collector-agent
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: pilke
data:
  # =========================================================================
  # THE GATEWAY. Everything that is stored passes through here, which is what
  # makes this the one place a privacy rule has to be written to hold.
  # =========================================================================
  gateway.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318

    processors:
      # First in every pipeline, and it has to be: it works by refusing data at
      # the front of the pipeline, so anything ahead of it is work done on data
      # that is about to be dropped anyway. The failure mode being designed
      # against is somebody pointing a load generator at the public ingest
      # path.
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 25

      # THE WHOLE OF THE PII DEFENCE. The applications are written not to send
      # any of this; this processor is what makes that a property of the system
      # rather than a property of every future call site. `allow_all_keys` with
      # a blocklist rather than an allowlist is the deliberate half of the
      # trade: an allowlist would silently drop every new attribute anybody
      # adds, and a pipeline that quietly discards the thing you came to look
      # for gets turned off.
      redaction:
        allow_all_keys: true
        blocked_key_patterns:
          - ".*phone.*"
          - ".*password.*"
          - ".*token.*"
          - ".*authorization.*"
          - ".*login_code.*"
          - ".*safety_contact.*"
        blocked_values:
          # A Finnish mobile number, in any attribute value, whatever the key is
          # called. The key patterns above catch the fields somebody named
          # honestly; this catches the ones they did not.
          - "\\+358[0-9]{6,}"
        summary: debug

      transform:
        # A statement that cannot apply is not a problem here: most of these
        # keys are absent on most spans, and one absent attribute must not stop
        # the rest of the list from running.
        error_mode: ignore

        trace_statements:
          # THE CLIENT IP IS DROPPED BEFORE STORAGE. This is a privacy
          # requirement and not an optimisation: any HTTP ingest sees an address,
          # an address is personal data, and the privacy policy says this is not
          # kept. Every name below is one that an OpenTelemetry HTTP
          # instrumentation sets for the same fact, across two semantic
          # convention generations — dropping four of five is dropping none.
          - delete_key(resource.attributes, "client.address")
          - delete_key(span.attributes, "client.address")
          - delete_key(span.attributes, "client.socket.address")
          - delete_key(span.attributes, "http.client_ip")
          - delete_key(span.attributes, "net.peer.ip")
          - delete_key(span.attributes, "net.sock.peer.addr")

          # A full URL carries the query string and the raw path, so it carries
          # every id the templating below exists to remove. The templated path
          # is what a reader actually needs.
          - delete_key(span.attributes, "url.full")
          - delete_key(span.attributes, "url.query")
          - delete_key(span.attributes, "http.url")

          # A path id is not secret and is identifying. Keep the route, drop the
          # value — which is also what makes "the slowest route" a question with
          # an answer rather than ten thousand distinct paths.
          - replace_pattern(span.attributes["url.path"], "/matches/[0-9]+", "/matches/{id}")
          - replace_pattern(span.attributes["url.path"], "/users/[0-9]+", "/users/{id}")
          - replace_pattern(span.attributes["http.target"], "/matches/[0-9]+", "/matches/{id}")
          - replace_pattern(span.attributes["http.target"], "/users/[0-9]+", "/users/{id}")

        log_statements:
          # The same addresses, on the same grounds. Container stdout arrives
          # here from the agent, so a log line that names a client address is
          # covered by exactly one rule rather than by two half-rules.
          - delete_key(resource.attributes, "client.address")
          - delete_key(log.attributes, "client.address")
          - delete_key(log.attributes, "http.client_ip")
          - delete_key(log.attributes, "net.peer.ip")
          - delete_key(log.attributes, "remote_addr")

          # ⚠️ `trace_id`, not `otelTraceID`. The Python logging
          # instrumentation emits its own names, and the trace-to-logs link on
          # the Grafana datasource matches `trace_id`. Getting this wrong breaks
          # nothing visible: the logs arrive, the traces arrive, and the one
          # click that makes triage fast is silently not there. Renaming here as
          # well as in the backend's formatter is deliberate belt and braces —
          # whichever name arrives, the field is right.
          - set(log.attributes["trace_id"], log.attributes["otelTraceID"]) where log.attributes["otelTraceID"] != nil
          - delete_key(log.attributes, "otelTraceID")
          - set(log.attributes["span_id"], log.attributes["otelSpanID"]) where log.attributes["otelSpanID"] != nil
          - delete_key(log.attributes, "otelSpanID")

      batch:
        send_batch_size: 1024
        timeout: 5s

    extensions:
      # The buffer that makes a store restart a delay rather than a hole in the
      # record. Two single-replica stores get restarted by every upgrade and
      # every node move, and without a queue behind them each one is a gap.
      #
      # ⚠️ The directory is an emptyDir, so it survives VictoriaLogs restarting
      # and does not survive this pod restarting. That is the trade for keeping
      # this namespace at the two PVCs the stores need, and it is the right way
      # round: a store restart is routine and planned, a gateway restart takes
      # five seconds and the SDKs retry across it.
      file_storage:
        directory: /var/lib/otelcol

      health_check:
        endpoint: 0.0.0.0:13133

    exporters:
      # ⚠️ `logs_endpoint` and `traces_endpoint`, NOT `endpoint`. These are full
      # paths. With `endpoint` the exporter appends `/v1/logs` to them and every
      # export 404s — which reads as a routing problem and is a config-key
      # problem.
      otlphttp/vlogs:
        logs_endpoint: http://vlsingle-pilke:9428/insert/opentelemetry/v1/logs
        headers:
          # VictoriaLogs turns OTLP *resource* attributes into stream fields by
          # default, and a stream field with a per-pod or per-instance value is
          # how this store acquires Loki's cardinality problem. The SDKs
          # cheerfully set `service.instance.id`, and the agent sets pod names.
          # Naming the low-cardinality set explicitly is what stops all of them
          # from becoming streams.
          VL-Stream-Fields: "service.name,deployment.environment"
        sending_queue:
          enabled: true
          storage: file_storage
        retry_on_failure:
          enabled: true

      otlphttp/vtraces:
        traces_endpoint: http://vtsingle-pilke:10428/insert/opentelemetry/v1/traces
        sending_queue:
          enabled: true
          storage: file_storage
        retry_on_failure:
          enabled: true

    service:
      extensions: [file_storage, health_check]
      telemetry:
        logs:
          level: info
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, redaction, transform, batch]
          exporters: [otlphttp/vtraces]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, redaction, transform, batch]
          exporters: [otlphttp/vlogs]

  # =========================================================================
  # THE AGENT. Container stdout for this namespace's Deployments, and nothing
  # else in the cluster.
  # =========================================================================
  agent.yaml: |
    receivers:
      filelog:
        # THIS GLOB IS THE SCOPE, and it is the only scope there is. Kubernetes
        # names the file <pod>_<namespace>_<container>-<id>.log, so a namespace
        # filter is a filename filter and it applies before a line is ever read.
        include:
          - /var/log/containers/*_pilke_*.log
        exclude:
          # Both collectors run in this namespace, so without this the collector
          # reads its own log, describes having read it, reads that, and the
          # loop is bounded only by the rate limit. Their logs are still there
          # for `kubectl logs`, which is where you would look for them anyway.
          - /var/log/containers/otel-collector-*_pilke_*.log

        # Everything already on disk when this starts is history that was never
        # collected, and replaying weeks of it on first sync would be the
        # store's first impression of itself.
        start_at: end

        # Where the read offsets live. Without it a restart re-reads from
        # `start_at` and loses whatever arrived while the pod was down.
        storage: file_storage

        include_file_path: true
        include_file_name: false
        retry_on_failure:
          enabled: true

        operators:
          # Unwraps the container runtime's envelope — the
          # `2026-08-22T… stdout F …` prefix that containerd and CRI-O write
          # around every line — and leaves the application's own line as the
          # body.
          #
          # `add_metadata_from_filepath: false` because this operator's path
          # regex only understands the /var/log/pods/ layout, and the glob above
          # is deliberately the /var/log/containers/ one. The next operator does
          # that job against the filename this DaemonSet actually reads.
          - type: container
            id: runtime-envelope
            add_metadata_from_filepath: false

          # Pod, namespace and container come out of the path with a regex.
          #
          # THE ALTERNATIVE IS THE k8sattributes PROCESSOR, WHICH READS THE SAME
          # THREE FACTS FROM THE KUBERNETES API and needs a ClusterRole to list
          # pods across namespaces to do it. This reads a filename. It holds no
          # Kubernetes permissions at all, which is as close as a DaemonSet gets
          # to being namespace-scoped.
          - type: regex_parser
            id: metadata-from-filename
            parse_from: attributes["log.file.path"]
            regex: '^/var/log/containers/(?P<pod>[^_]+)_(?P<namespace>[^_]+)_(?P<container>.+)-[0-9a-f]+\.log$'

          # Onto the resource, not the record: these describe where the line came
          # from rather than what it says, and the exporters' stream-field header
          # is what keeps them from each becoming a stream.
          - type: move
            from: attributes.pod
            to: resource["k8s.pod.name"]
          - type: move
            from: attributes.namespace
            to: resource["k8s.namespace.name"]
          - type: move
            from: attributes.container
            to: resource["k8s.container.name"]

          # In production the backend's console handler writes JSON, so the
          # fields are parsed rather than guessed at. The guard matters: the
          # migration Job, gunicorn's own startup lines and anything that
          # crashes before logging is configured are plain text, and a parser
          # that fails on them would drop exactly the lines you need when a pod
          # will not start.
          - type: json_parser
            id: application-json
            parse_from: body
            if: 'body matches "^\\s*\\{"'
            on_error: send

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 25

      transform:
        error_mode: ignore
        log_statements:
          # The container name is `api`, `worker` or `scheduler`; the traces from
          # the same process arrive as `pilke-api` and so on from
          # OTEL_SERVICE_NAME. They have to agree, or a service looks like two
          # services and the trace-to-logs click lands nowhere.
          - set(resource.attributes["service.name"], Concat(["pilke", resource.attributes["k8s.container.name"]], "-")) where resource.attributes["k8s.container.name"] != nil
          # The second of the two stream fields. Constant here because this
          # cluster is the production one; it exists so the field is present and
          # low-cardinality rather than absent.
          - set(resource.attributes["deployment.environment"], "prod")

      batch:
        send_batch_size: 1024
        timeout: 5s

    extensions:
      # A hostPath, unlike the gateway's: read offsets are per-node state and
      # they are the one thing here that must outlive the pod. Losing them
      # re-reads or skips a node's log tail.
      file_storage:
        directory: /var/lib/otelcol-agent

      health_check:
        endpoint: 0.0.0.0:13133

    exporters:
      # THROUGH THE GATEWAY, NOT STRAIGHT TO THE STORE. Container stdout is
      # where PII leaks in practice — a stray log of a response body puts
      # profiles and phone numbers on disk — so the agent's output goes through
      # the same `redaction` processor as everything else, and only the gateway
      # knows the stores' addresses.
      #
      # `logs_endpoint` with the full path here too, for the same reason as in
      # the gateway: the key that appends a path for you is the one that 404s.
      otlphttp/gateway:
        logs_endpoint: http://otel-collector:4318/v1/logs
        sending_queue:
          enabled: true
          storage: file_storage
        retry_on_failure:
          enabled: true

    service:
      extensions: [file_storage, health_check]
      telemetry:
        logs:
          level: info
      pipelines:
        logs:
          receivers: [filelog]
          processors: [memory_limiter, transform, batch]
          exporters: [otlphttp/gateway]
