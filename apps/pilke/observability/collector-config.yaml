# The gateway's pipeline. Everything that is stored passes through here, which
# is what makes this the one place a privacy rule has to be written to hold.
#
# ⚠️ EDITING THIS FILE CHANGES NOTHING UNTIL THE PODS ARE REPLACED. The gateway
# mounts it as a file and reads it once at startup, and Argo does not roll a
# workload because a ConfigMap it mounts changed. The same footgun as
# `prerequisites/configmap.yaml`, and the opposite of the alert rules beside it,
# which vmalert reloads on its own:
#
#     kubectl -n pilke rollout restart deploy/otel-collector
#
# ⚠️ THE AGENT'S PIPELINE IS IN `../log-agent/collector-agent-config.yaml`, in
# the `pilke-logs` namespace, and the two are one design. The agent ships
# container stdout into the `otlp` receiver below like any other client, so the
# `redaction` processor here is what covers the logs as well as the traces —
# stdout being where PII actually leaks. A rule weakened in this file is
# weakened for the node logs too, and that is not visible from the agent's side.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: pilke
data:
  gateway.yaml: |
    receivers:
      # ⚠️ TWO OTLP RECEIVERS, AND WHICH OF THEM IS AUTHENTICATED IS THE WHOLE
      # DESIGN. This one is the in-cluster ingest and it takes no credential:
      # the three application Deployments reach it through
      # `OTEL_EXPORTER_OTLP_ENDPOINT` in `../prerequisites/configmap.yaml`, and
      # the agent DaemonSet has `otel-collector.pilke.svc.cluster.local:4318`
      # written into `../log-agent/collector-agent-config.yaml`, in another
      # namespace and another Argo Application. None of those four senders sets
      # an `Authorization` header, and there is no per-client exemption to
      # configure in a receiver's authenticator — so requiring a token *here*
      # stops all four, and stops them silently: a refused export is a line in
      # the sender's own log and an absence in Grafana.
      #
      # What keeps this port private is that it is a ClusterIP port with
      # nothing routing to it from outside. `ingress-otlp.yaml` names 4319.
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318

      # The public half, and the only receiver `ingress-otlp.yaml` can reach.
      # A second receiver rather than a second protocol on the one above,
      # because the authenticator is a property of a receiver's server: "open
      # inside the namespace, authenticated from the internet" is two servers
      # however it is written, and putting the new port on the public side is
      # what makes this change need no restart of anything but the gateway.
      #
      # ⚠️ IN THE TRACES PIPELINE ONLY, and that is a second lock rather than
      # tidiness. The OTLP receiver serves `/v1/logs` only when a logs pipeline
      # names it, so leaving this receiver out of the logs pipeline below is
      # what makes a log record posted at this port a 404. The app sends spans;
      # log records arrive from the agent on 4318.
      #
      # No `cors` block: the sender is a React Native bundle making a plain
      # POST, not a browser making a preflighted one. A web build would need
      # `allowed_origins` here plus `Authorization` in `allowed_headers`, and
      # its preflight fails without them.
      otlp/public:
        protocols:
          http:
            endpoint: 0.0.0.0:4319
            auth:
              authenticator: bearertokenauth

    processors:
      # First in every pipeline, and it has to be: it works by refusing data at
      # the front of the pipeline, so anything ahead of it is work done on data
      # that is about to be dropped anyway. The failure mode being designed
      # against is somebody pointing a load generator at the public ingest
      # path.
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 25

      # THE WHOLE OF THE PII DEFENCE. The applications are written not to send
      # any of this; this processor is what makes that a property of the system
      # rather than a property of every future call site. `allow_all_keys` with
      # a blocklist rather than an allowlist is the deliberate half of the
      # trade: an allowlist would silently drop every new attribute anybody
      # adds, and a pipeline that quietly discards the thing you came to look
      # for gets turned off.
      redaction:
        allow_all_keys: true
        blocked_key_patterns:
          - ".*phone.*"
          - ".*password.*"
          - ".*token.*"
          - ".*authorization.*"
          - ".*login_code.*"
          - ".*safety_contact.*"
        blocked_values:
          # A Finnish mobile number, in any attribute value, whatever the key is
          # called. The key patterns above catch the fields somebody named
          # honestly; this catches the ones they did not.
          - "\\+358[0-9]{6,}"
        summary: debug

      transform:
        # A statement that cannot apply is not a problem here: most of these
        # keys are absent on most spans, and one absent attribute must not stop
        # the rest of the list from running.
        error_mode: ignore

        trace_statements:
          # THE CLIENT IP IS DROPPED BEFORE STORAGE. This is a privacy
          # requirement and not an optimisation: any HTTP ingest sees an address,
          # an address is personal data, and the privacy policy says this is not
          # kept. Every name below is one that an OpenTelemetry HTTP
          # instrumentation sets for the same fact, across two semantic
          # convention generations — dropping four of five is dropping none.
          - delete_key(resource.attributes, "client.address")
          - delete_key(span.attributes, "client.address")
          - delete_key(span.attributes, "client.socket.address")
          - delete_key(span.attributes, "http.client_ip")
          - delete_key(span.attributes, "net.peer.ip")
          - delete_key(span.attributes, "net.sock.peer.addr")

          # A full URL carries the query string and the raw path, so it carries
          # every id the templating below exists to remove. The templated path
          # is what a reader actually needs.
          - delete_key(span.attributes, "url.full")
          - delete_key(span.attributes, "url.query")
          - delete_key(span.attributes, "http.url")

          # A path id is not secret and is identifying. Keep the route, drop the
          # value — which is also what makes "the slowest route" a question with
          # an answer rather than ten thousand distinct paths.
          - replace_pattern(span.attributes["url.path"], "/matches/[0-9]+", "/matches/{id}")
          - replace_pattern(span.attributes["url.path"], "/users/[0-9]+", "/users/{id}")
          # ⚠️ THE QUERY STRING GOES FIRST, BEFORE ANY OTHER RULE TOUCHES THIS KEY.
          # `http.target` is path AND query. `url.query` and `url.full` are deleted
          # above, but this attribute is the one the Django instrumentation actually
          # sets, and it carries everything after the `?` with it.
          #
          # GET /api/activities/nearby takes `longitude` and `latitude` as bare query
          # parameters, and the handler's own docstring calls that point "somewhere the
          # user is considering". The area picker calls it as it is panned. So without
          # this line every pan writes a coordinate into a store that keeps it for
          # thirty days -- while the privacy statement says the pipeline refuses
          # coordinates, and section 4.3 audits four separate promises about location.
          #
          # It is a truncation and not a redaction on purpose: a value is never worth
          # inspecting to decide whether to keep it. The route is already on the span as
          # `http.route`, so nothing of diagnostic worth is lost.
          - replace_pattern(span.attributes["http.target"], "\\?.*$", "")
          - replace_pattern(span.attributes["url.path"], "\\?.*$", "")
          - replace_pattern(span.attributes["http.target"], "/matches/[0-9]+", "/matches/{id}")
          - replace_pattern(span.attributes["http.target"], "/users/[0-9]+", "/users/{id}")

        log_statements:
          # The same addresses, on the same grounds. Container stdout arrives
          # here from the agent, so a log line that names a client address is
          # covered by exactly one rule rather than by two half-rules.
          - delete_key(resource.attributes, "client.address")
          - delete_key(log.attributes, "client.address")
          - delete_key(log.attributes, "http.client_ip")
          - delete_key(log.attributes, "net.peer.ip")
          - delete_key(log.attributes, "remote_addr")

          # ⚠️ `trace_id`, not `otelTraceID`. The Python logging
          # instrumentation emits its own names, and the trace-to-logs link on
          # the Grafana datasource matches `trace_id`. Getting this wrong breaks
          # nothing visible: the logs arrive, the traces arrive, and the one
          # click that makes triage fast is silently not there. Renaming here as
          # well as in the backend's formatter is deliberate belt and braces —
          # whichever name arrives, the field is right.
          - set(log.attributes["trace_id"], log.attributes["otelTraceID"]) where log.attributes["otelTraceID"] != nil
          - delete_key(log.attributes, "otelTraceID")
          - set(log.attributes["span_id"], log.attributes["otelSpanID"]) where log.attributes["otelSpanID"] != nil
          - delete_key(log.attributes, "otelSpanID")

      batch:
        send_batch_size: 1024
        timeout: 5s

    extensions:
      # ⚠️ THIS KEY IS OBFUSCATION AND NOT A SECRET, and every decision around
      # it has to be read that way. It is compiled into the app's JS bundle, so
      # everybody holding the APK holds the key; what it buys is that a scanner
      # sweeping `api.pilke.app` does not find an open ingest, and that abuse
      # can be answered by rotating one value. It does NOT make this endpoint
      # private, and nothing downstream may treat a span as ours because it
      # arrived with the key. The Ingress rate limits and `memory_limiter`
      # above are what actually bound the damage, and the `redaction` processor
      # is what bounds what a forged span can put in the store.
      #
      # Read from the environment rather than written here, out of
      # `otlp-ingest-key.sealed.yaml` by way of the gateway's `env` — keeping a
      # rotatable value out of this repository's history is worth doing even
      # for a value that ends up in a bundle. An unset or empty variable is a
      # startup failure, `no bearer token provided`, rather than a collector
      # running with an empty expected token.
      #
      # Rotation is three steps and the middle one is the one that gets
      # forgotten: reseal this value, `rollout restart deploy/otel-collector`
      # (a ConfigMap or Secret change does not roll a Deployment on its own),
      # then ship an app build carrying the new key. Between the restart and
      # that build, client telemetry is refused with a 401 — so rotate in the
      # other order, or accept the gap knowingly.
      bearertokenauth:
        scheme: Bearer
        token: ${env:OTLP_INGEST_KEY}

      # The buffer that makes a store restart a delay rather than a hole in the
      # record. Two single-replica stores get restarted by every upgrade and
      # every node move, and without a queue behind them each one is a gap.
      #
      # ⚠️ The directory is an emptyDir, so it survives VictoriaLogs restarting
      # and does not survive this pod restarting. That is the trade for keeping
      # this namespace at the two PVCs the stores need, and it is the right way
      # round: a store restart is routine and planned, a gateway restart takes
      # five seconds and the SDKs retry across it.
      file_storage:
        directory: /var/lib/otelcol

      health_check:
        endpoint: 0.0.0.0:13133

    exporters:
      # ⚠️ `logs_endpoint` and `traces_endpoint`, NOT `endpoint`. These are full
      # paths. With `endpoint` the exporter appends `/v1/logs` to them and every
      # export 404s — which reads as a routing problem and is a config-key
      # problem.
      otlphttp/vlogs:
        logs_endpoint: http://vlsingle-pilke:9428/insert/opentelemetry/v1/logs
        headers:
          # VictoriaLogs turns OTLP *resource* attributes into stream fields by
          # default, and a stream field with a per-pod or per-instance value is
          # how this store acquires Loki's cardinality problem. The SDKs
          # cheerfully set `service.instance.id`, and the agent sets pod names.
          # Naming the low-cardinality set explicitly is what stops all of them
          # from becoming streams.
          VL-Stream-Fields: "service.name,deployment.environment"
        sending_queue:
          enabled: true
          storage: file_storage
        retry_on_failure:
          enabled: true

      otlphttp/vtraces:
        traces_endpoint: http://vtsingle-pilke:10428/insert/opentelemetry/v1/traces
        sending_queue:
          enabled: true
          storage: file_storage
        retry_on_failure:
          enabled: true

    service:
      extensions: [bearertokenauth, file_storage, health_check]
      telemetry:
        logs:
          level: info
      pipelines:
        traces:
          # Both receivers into one pipeline, so a span from a phone is redacted
          # by exactly the same processors as a span from the API. The public
          # receiver being authenticated changes where a span may come from and
          # nothing about what happens to it afterwards.
          receivers: [otlp, otlp/public]
          processors: [memory_limiter, redaction, transform, batch]
          exporters: [otlphttp/vtraces]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, redaction, transform, batch]
          exporters: [otlphttp/vlogs]
