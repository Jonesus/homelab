apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - configmap.yaml
  - database.yaml
  - database-user.sealed.yaml
  - app-secrets.sealed.yaml
  - ghcr-pull.sealed.yaml
  # Grafana's admin login. The chart generates a random one per render when
  # it is not given one, which leaves pilke-grafana permanently OutOfSync.
  - grafana-admin.sealed.yaml
  # Here, in wave -1 with the database, so the policy that guards Postgres exists
  # from the same sync that creates it. What is live and what is staged is in
  # that directory's own kustomization.
  - network-policy
  # Backups to the QNAP store. The line and the patch below go on and off
  # together: `backup/cluster-archiving.yaml` names the ObjectStore `backup/`
  # creates, and adding or removing it restarts the database.
  - backup

patches:
  - path: backup/cluster-archiving.yaml

namespace: pilke
