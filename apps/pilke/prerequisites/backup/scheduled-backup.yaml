# A base backup every night. WAL archiving is what makes point-in-time recovery
# possible; this bounds how much WAL a restore has to replay, and gives the 30-day
# retention in `object-store.yaml` something to count.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: pilke-postgres-nightly
  namespace: pilke
spec:
  # ⚠️ SIX FIELDS, AND THE FIRST IS SECONDS. This is CNPG's cron dialect, not a
  # CronJob's: `0 15 1 * * *` is 01:15:00 every day, in the operator's time zone,
  # which is UTC. That is 03:15 or 04:15 in Helsinki, clear of the photo rsync's
  # 03:00 (UTC) run against the same QNAP.
  schedule: "0 15 1 * * *"
  # One backup as soon as this is created, rather than waiting for the first
  # night. The rollout's check reads that one.
  immediate: true
  # The Backup objects belong to this ScheduledBackup, so deleting it deletes
  # them. The objects are only Kubernetes' record of a backup; the backup is in
  # the bucket, and retention there is the ObjectStore's.
  backupOwnerReference: self
  cluster:
    name: pilke-postgres
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
