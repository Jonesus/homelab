# STAGE 1. Who may open a connection to Postgres: the four processes that hold
# its password, the operator, and the instances themselves.
#
# Ingress only, on purpose. This is the half that closes what the audit found
# (I-05: `pilke-postgres-rw:5432` reachable from every pod in a cluster that
# shares a node pool with fifteen other apps, nine of them public), and it is
# the half that cannot take the database's own operation down with it: nothing
# the instance dials out to is touched until `database-egress.yaml`.
#
# The selector is the operator's own label, so it covers every pod of this
# Cluster — the instances and the Jobs a bootstrap or a recovery runs — and a
# second instance added later without anything here changing.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pilke-postgres-ingress
  namespace: pilke
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: pilke-postgres
  policyTypes:
    - Ingress
  ingress:
    # The application. `pilke-migrate` is the PreSync Job, and it is the one
    # that is easy to forget: leave it out and every deploy fails at its first
    # step, with the old pods still serving, which reads as a broken migration.
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - pilke-api
                  - pilke-worker
                  - pilke-scheduler
                  - pilke-migrate
                  # The hourly logical dump, `../../app/db-dump.yaml`.
                  - pilke-db-dump
      ports:
        - protocol: TCP
          port: 5432

    # The operator: the instance manager's status endpoint on 8000, which is
    # how it knows the primary is alive at all, and Postgres itself. Both are
    # what CNPG's documentation asks for, in its own sample policy.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 5432

    # Instance to instance: streaming replication and the instance manager's
    # own calls between pods. One instance today, so this matches nothing yet;
    # without it, `instances: 2` would bring up a replica that can never join.
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: pilke-postgres
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8000
