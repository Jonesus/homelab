# Where the hourly pg_dump and the media mirror land.
#
# WARNING: this is the same NAS as the database and media volumes, so it is a
# defence against a bad migration or a dropped table and NOT against losing the
# NAS. An offsite or second-box copy is still an open decision
# (treffit-backend#14 §7.5).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pilke-backup-pvc
  namespace: pilke
spec:
  storageClassName: iscsi
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
