# Configuration, in `prerequisites` rather than beside the Deployments that read
# it — because `pilke-migrate` is a `PreSync` hook, and a PreSync hook runs
# before Argo syncs *anything* in the app, including its own ConfigMap. Leaving
# this in `app/` made the first deploy fail with `configmap "pilke-config" not
# found`, which reads as a missing file rather than as an ordering problem.
#
# The sealed secrets the same Job reads are already here, and for the same
# reason. Wave -1 is what makes both exist first.
#
# ⚠️ **EDITING THIS FILE CHANGES NOTHING UNTIL THE PODS ARE REPLACED.** The
# Deployments read it with `envFrom`, which is resolved once at pod start, and
# Argo does not roll a Deployment because a ConfigMap it references changed. So
# after every commit that touches this:
#
#     kubectl -n pilke rollout restart deploy/pilke-api deploy/pilke-worker deploy/pilke-scheduler
#
# That is a footgun in general and a security one here: `SMS_BACKEND` below is
# what stops the login endpoint handing out one-time codes, and setting it looked
# exactly like working while the running pods still had the old value.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pilke-config
  namespace: pilke
data:
  # `ENV=prod` hard-forces DEBUG=False in settings.py regardless of DEBUG, so
  # both is redundant on purpose. It is load-bearing past convention: with DEBUG
  # off, `manage.py reset_penalties` refuses to run without --force, which is
  # what you want on a database holding real users' cooldowns.
  ENV: "prod"
  DEBUG: "0"
  DJANGO_SETTINGS_MODULE: "treffit_backend.settings"

  # Space-separated. `localhost` is here so the readiness probe can send it as a
  # Host header without coupling the probe to a public hostname.
  DJANGO_ALLOWED_HOSTS: "api.pilke.app pilke.internal localhost"

  # Space-separated AND scheme-qualified, unlike ALLOWED_HOSTS. Without it the
  # admin's own login POST is rejected with "Origin checking failed", which
  # reads as a mystery rather than as a setting.
  CSRF_TRUSTED_ORIGINS: "https://api.pilke.app https://pilke.internal"

  DATABASE_ENGINE: "django.contrib.gis.db.backends.postgis"
  DATABASE_HOST: "pilke-postgres-rw"
  DATABASE_PORT: "5432"
  POSTGRES_DB: "treffit"

  # Photographs live in Garage rather than on a volume, so there is no
  # ASSETS_DIR and the api pods mount nothing.
  #
  # `SameOriginS3Storage` is the project's own subclass, and the reason the app
  # needs no release for this: it stores in the bucket but answers `/assets/…`,
  # the same relative path `FileSystemStorage` produced. The client concatenates
  # that onto the API base, and the base is compiled into the bundle.
  MEDIA_STORAGE_BACKEND: "treffit_backend.utils.storage.SameOriginS3Storage"

  # `file_overwrite: false` is not a preference. django-storages defaults it to
  # true, which skips Django's `get_available_name` — so two users who both
  # upload `photo.jpg` would land on the same key and the second would replace
  # the first's face. False restores the suffixing the filesystem backend did.
  #
  # Path addressing because Garage's virtual-host style needs a wildcard DNS
  # entry under `s3_region`, and the cluster has none.
  # `signing_endpoint_url` is the project's own option and the reason a photograph
  # can be both uploaded internally and opened from a phone. One `endpoint_url`
  # does both jobs until addresses are signed, and then they pull apart: a `PUT`
  # is made by this pod and wants the cluster service, while a presigned `GET` is
  # opened by somebody's phone and has to name a host that phone can resolve. A
  # signature covers the Host, so signing with the internal address produces URLs
  # that verify correctly and cannot be opened.
  #
  # Uploads therefore stay on the cluster network — two hops, no public DNS, no
  # dependency on the ingress being healthy — and only the signature is computed
  # for `api.pilke.app`. `treffit_backend/utils/storage.py` argues it.
  MEDIA_STORAGE_OPTIONS: >-
    {"bucket_name": "assets",
     "endpoint_url": "http://garage.garage.svc.cluster.local:3900",
     "signing_endpoint_url": "https://api.pilke.app",
     "region_name": "garage",
     "addressing_style": "path",
     "file_overwrite": false}

  # ⚠️ THIS IS HALF OF A SECURITY CONTROL, AND THE OTHER HALF IS NOT IN GIT.
  #
  # On its own this changes the address a photograph is served at — from a
  # permanent `/assets/<key>` to a presigned URL that expires — and nothing about
  # who may read one. The boundary is Garage refusing anonymous reads:
  #
  #     garage bucket website --deny assets
  #
  # which is a CLI call against the running pod, recorded in
  # `../../garage/README.md` because no manifest here can express it. **A rebuild
  # from these files alone would come back with the bucket public.**
  #
  # ⚠️ **The route change alone closes the public unsigned path**, which is not
  # what the plan expected: `/assets` now reaches the S3 API, and that endpoint
  # demands a signature whatever the bucket's website flag says. The flag only
  # governs port 3902, which no Ingress points at any more. So the "photographs
  # work by either address while this is checked" safety net does not exist —
  # unsigned addresses already in a phone's persisted cache answer 403 until the
  # next refetch, bounded by the app's 24-hour `CACHE_MAX_AGE`.
  #
  # What the deny is still for: anonymous reads are reachable from **inside** the
  # cluster on 3902 — measured, 200 with the bucket's Host — and an Ingress
  # pointed back at that port would silently reopen the hole. Jonesus/homelab#4.
  #
  # `MEDIA_URL_EXPIRY` is left unset: the default is seven days, which is SigV4's
  # own ceiling and comfortably outlives the app's 24-hour persisted cache. A
  # shorter expiry would leave the date screen — deliberately readable offline —
  # drawing broken images on exactly the cold start it exists for.
  MEDIA_SIGNED_URLS: "1"

  # NOTE: STATIC_DIR is deliberately absent. The Dockerfile runs collectstatic
  # at build time into /app/static, which is STATIC_ROOT's default, and
  # WhiteNoise serves from there. Pointing STATIC_DIR at an empty volume is the
  # one reliable way to undo that and leave the admin unstyled.

  PUSH_BACKEND: "treffit_backend.notifications.push.ExpoPushBackend"

  TZ: "Europe/Helsinki"

  # ⚠️ SETTING THIS IS THE SECURITY CONTROL, NOT UNSETTING IT.
  #
  # While no backend really texts, `POST /api/auth/login` returns the one-time
  # code in its response body — so anybody who knows a registered phone number
  # owns that account. `users.login_codes` reads exactly one thing,
  # `reaches_the_recipient`, so naming a real backend is what closes the hole and
  # what arms the send rate limit. There is no second switch.
  #
  # It is set here in the same commit that adds `ingress.yaml` to the app's
  # kustomization, because that Ingress is what makes the API reachable from the
  # internet. Neither belongs without the other.
  #
  # `SEVEN_API_KEY` is in the sealed secret and was proved against the live
  # service before this was set: an empty key with this backend selected FAILS
  # every login rather than falling back to echoing the code, which is the right
  # failure and a poor surprise.
  #
  # ⚠️ A refused key does not announce itself. seven.io answers HTTP 200 with
  # `success: "900"` in the body, so nothing about the transport looks unusual and
  # `SevenSmsBackend._check` reads the body instead. `/api/balance` answers the
  # same `"900"`, which is how a key is proved without spending anything.
  #
  # ⚠️ The credit is prepaid, which makes it an availability dependency rather
  # than a cost: exhaustion sends no code, so nobody signs in — including anybody
  # whose session happens to lapse that week. The gateway returns the balance on
  # every send and `SEVEN_LOW_BALANCE_EUROS` warns below it. That warning predicts
  # a total authentication outage, so it is worth alerting on rather than reading.
  #
  # ⚠️ `SEVEN_SENDER` must be set to something, and empty is the one value that
  # does not work. Empty leaves the seven.io account default, which is the literal
  # string `SMS`, and DNA drops it: measured on a correctly routed send to a DNA
  # subscriber, `SMS` sat at TRANSMITTED and never arrived while `Pilke` to the
  # same handset was delivered in three seconds. The value itself is invisible —
  # since Traficom Order 28 L/2025 an unregistered sender ID towards a Finnish
  # number is blocked or rewritten to `Tuntematon` from 4 May 2026 and additionally
  # labelled `Roskaposti` from 2 November 2026, and `Pilke` does arrive as
  # `Tuntematon`. So the login copy has to name the app, and registration (€200/yr,
  # must match the YTJ business name) buys the handset label rather than delivery.
  #
  # `SEVEN_MNP_LOOKUP` stays unset, which is on: the backend asks seven.io which
  # network each number is on before texting it, at €0.005 a lookup. Without it,
  # three codes for a DNA subscriber were submitted to Elisa and none arrived.
  # `SEVEN_BASE_URL` stays unset: seven.io runs one platform, so there is no wrong
  # host to pick.
  #
  # `GATEWAYAPI_TOKEN` and its settings stay available, so reaching for the other
  # provider is naming `GatewayApiSmsBackend` here and nothing else.
  #
  # ⚠️ This is a per-environment choice. Every Maestro flow authenticates by
  # reading the code out of the login response, so this host is one the e2e suite
  # cannot drive. Local and CI keep `RecordingSmsBackend`.
  SMS_BACKEND: "treffit_backend.notifications.sms.SevenSmsBackend"
  SEVEN_SENDER: "Pilke"

  # --- The accounts Google and Apple review the app on ---------------------
  #
  # A store reviewer has to sign in, and the line above is why they cannot:
  # authentication is an SMS to a Finnish number, and nobody at Play Console or
  # App Store Connect holds one. So these two make `+358123456789` accept
  # `123456` every time, with no message sent, and `POST /api/auth/login`
  # answers it with an empty body like every other number on this host.
  #
  # ⚠️ **THE CODE IS A PUBLISHED PASSWORD**, and belongs in git for that reason
  # rather than in the sealed secret beside `SEVEN_API_KEY`. It goes in a store
  # listing field, so everyone who can read that listing can sign into these
  # accounts — sealing it would be theatre, and would hide the one value somebody
  # auditing this file should see plainly.
  #
  # What makes that affordable: the accounts hold nothing worth reaching, the
  # five-guess cap and five-minute expiry still apply because the code is stored
  # as an ordinary `LoginCode`, and `confirm_login_code` is untouched. What it
  # costs: the account is an ordinary participant in matching, so a profile
  # nobody is behind can appear on a real user's platter, and a stranger with the
  # listing in front of them can act as it. `users.store_review` argues both.
  #
  # Set together or not at all — the process refuses to start with one, because
  # a number without a code is an account nobody can get into and no SMS goes to
  # it to say so. Six digits exactly, since it is stored in a char(6) column.
  #
  # ⚠️ The accounts themselves are NOT created by this. After a rollout:
  #
  #     kubectl -n pilke exec deploy/pilke-api -c api -- \
  #       python manage.py seed_store_review_accounts
  #
  # Idempotent, and a no-op while these are unset. Unset both and delete the
  # accounts to close the door between submissions.
  STORE_REVIEW_PHONE_NUMBERS: "+358123456789"
  STORE_REVIEW_LOGIN_CODE: "123456"

  # NOTE: TESTER_PHONE_NUMBERS is deliberately NOT here. It names the accounts
  # the seeded mock cast is kept matchable for — `manage.py match_partners` with
  # no `--for`, run daily by `core.tasks.keep_testers_matchable` — and those are
  # real people's mobile numbers, which this public repository is the wrong place
  # for. It is in the sealed secret beside DJANGO_SUPERUSER_PHONE_NUMBER; the two
  # numbers above are the exception because that one is invented and its code is
  # published in a store listing on purpose.

  # --- Telemetry -----------------------------------------------------------
  #
  # `treffit_backend/telemetry.py` is a no-op when OTEL_EXPORTER_OTLP_ENDPOINT
  # is unset, and that is what keeps `make test`, the Maestro suite's backend and
  # every developer's laptop silent by default. Setting it here is what turns it
  # on, for this environment only.
  #
  # The collector, not either store. The stores have no authentication at all, so
  # they are never addressed directly; the collector is where redaction happens,
  # where the client address is dropped, and where the disk-backed queue makes a
  # store restart a delay rather than a gap.
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.pilke.svc.cluster.local:4318"

  # http/protobuf, because that is the exporter the image installs — the OTLP
  # gRPC exporter is a separate package and is not a dependency. Left unset the
  # SDK defaults to gRPC, tries port 4317, and every export fails with a
  # connection error that reads like a network problem.
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"

  # No sampling. At a few hundred spans a minute, sampling only ever costs you
  # the trace you went looking for. `parentbased` is the part that matters when
  # the app starts sending: a request that begins with a tap on a phone arrives
  # carrying `traceparent`, and this is what makes the server side of it join
  # that trace instead of starting a new one.
  OTEL_TRACES_SAMPLER: "parentbased_always_on"

  # The route on the request span, which is what makes "which endpoint is slow"
  # answerable. Deliberately `path_info` and nothing else: the Django
  # instrumentation can attach any request attribute, and `META` would put
  # headers — Authorization included — on every span. The collector templates
  # the ids out of this path and drops the full URL.
  OTEL_PYTHON_DJANGO_TRACED_REQUEST_ATTRS: "path_info"

  # ⚠️ Both exporters off, and both are load-bearing. `pilke-worker` and
  # `pilke-scheduler` start under `opentelemetry-instrument`, which configures a
  # metrics exporter AND a logs exporter by default — so left unset, those two
  # processes would ship metrics this deployment does not collect, and would ship
  # logs through `opentelemetry.sdk._logs`, which is the experimental API the
  # whole stdout-plus-filelog design exists to avoid. Both would go to the
  # collector's OTLP port and be accepted. `pilke-api` does not read these (its
  # provider is built by hand in `telemetry.py`), and it costs nothing for it to.
  OTEL_METRICS_EXPORTER: "none"
  OTEL_LOGS_EXPORTER: "none"

  # ⚠️ OTEL_SERVICE_NAME IS NOT HERE, AND MUST NOT BE. Three Deployments read
  # this one ConfigMap and need three different names, so it is set in each
  # Deployment's own `env:`. Put it here and all three processes appear as one
  # service: the API's error rate, the worker's and the scheduler's added
  # together, with no way to tell afterwards which was which.

  # --- Mail ----------------------------------------------------------------
  #
  # PostStack carries every email this product sends: the confirmation link for
  # the address collected at sign-up, and the safety alert below.
  # `pilke-app/docs/plans/email.md` argues the choice and records what is open.
  #
  # ⚠️ Like SMS_BACKEND, this is also a switch on an echo:
  # `POST /api/users/me/email/verify` hands its confirmation token back in the
  # response body exactly while no mail is going out, so that an environment
  # with no provider can still finish the flow. Naming a real backend closes
  # that, with no second setting.
  #
  # `POSTSTACK_API_KEY` and `POSTSTACK_WEBHOOK_SECRET` are in the sealed secret.
  # MAIL_FROM, MAIL_ALERT_FROM and MAIL_ALERT_TO are left unset: their defaults
  # are `hei@pilke.app`, `turvallisuus@pilke.app` and `turvallisuus@pilke.app`,
  # which is what this deployment wants.
  MAIL_BACKEND: "treffit_backend.notifications.email.PostStackEmailBackend"

  # ⚠️ SETTING THIS IS A CLAIM ABOUT SOMEBODY'S ATTENTION.
  #
  # A safety report and a contested no-show are the two events where a row in a
  # table is not enough. This backend mails them to MAIL_ALERT_TO —
  # `turvallisuus@pilke.app`, which the owner confirmed on 2026-08-28 is a
  # **monitored inbox**. **That is the half of `reaches_an_admin` no code can
  # check**, and naming this backend is the assertion that it holds; the
  # confirmation is what makes the assertion true rather than aspirational.
  #
  # The half that is checked: the class refuses to send through a mail backend
  # that only records, so `notify_admins` cannot report that somebody was told
  # when nobody was. MAIL_BACKEND above is therefore a prerequisite rather than
  # a companion.
  #
  # The app's copy has caught up (treffit-backend#22, pilke-app#16). It used to
  # stop short of promising that a person reads a report, which was weaker than
  # the truth once this was set — the safe direction, and deliberately not fixed
  # on the same day. `report_intro` and `dates.feedback.report.filed` now say the
  # report is *passed on* to Pilke's staff.
  #
  # ⚠️ **None of it says when, and that is a ruling rather than an omission.** A
  # timeline is risky when a case may have to be taken to the authorities, so the
  # copy states that a person is told and never how soon. Anybody "finishing" it
  # with a response time is undoing a decision.
  ADMIN_ALERT_BACKEND: "treffit_backend.notifications.admin_alerts.PostStackAdminAlertBackend"

  # DECLINE_LADDER_ENABLED stays unset. Every `hidden` cooldown removes a user
  # from everybody's platter, so at beta pool sizes that rule's cost falls on
  # the users it exists to protect.

