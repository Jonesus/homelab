# `/assets` — the profile photographs — served anonymously out of Garage.
#
# Two objects for one route, and both are forced by where things live.
#
# An Ingress can only name a Service in its own namespace, and Garage is in
# `garage` because it is a cluster service rather than Pilke's. The
# `ExternalName` Service is the standard way across that line: it resolves to
# Garage's headless Service and gives the Ingress something local to point at.
#
# A separate Ingress because the two annotations below are per-object and must
# not reach the API's own routes: `rewrite-target` would eat every path, and
# `upstream-vhost` would send the API requests addressed to a bucket.
apiVersion: v1
kind: Service
metadata:
  name: pilke-assets
  namespace: pilke
spec:
  type: ExternalName
  externalName: garage.garage.svc.cluster.local
  ports:
    - name: web
      port: 3902
      targetPort: 3902
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pilke-ingress-assets
  namespace: pilke
  annotations:
    cert-manager.io/cluster-issuer: "internal-ca"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    # Garage's web endpoint routes by Host against `root_domain`, so this is
    # what selects the `assets` bucket. Without it the request arrives as
    # `api.pilke.app` and Garage has no bucket by that name.
    nginx.ingress.kubernetes.io/upstream-vhost: "assets.web.garage.internal"
    # The web endpoint serves from the bucket root, so the `/assets` prefix that
    # selected this route has to come off: `/assets/users/x.jpg` is the object
    # `users/x.jpg`.
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    # ExternalName upstreams are resolved by name at request time rather than
    # from the endpoints list, which is what makes a cross-namespace Service
    # work here at all.
    nginx.ingress.kubernetes.io/service-upstream: "true"
spec:
  ingressClassName: nginx
  tls:
    - secretName: pilke-internal-tls
      hosts:
        - pilke.internal
  rules:
    - host: pilke.internal
      http:
        paths:
          - path: /assets(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: pilke-assets
                port:
                  name: web
