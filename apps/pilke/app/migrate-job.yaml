# Runs to completion before Argo touches the Deployments, so new code never sees
# an unmigrated database. A failed migration fails the sync and leaves the old
# pods serving, which is the behaviour you want.
#
# A Job rather than an init container: an init container runs once per replica
# and would race itself.
apiVersion: batch/v1
kind: Job
metadata:
  name: pilke-migrate
  namespace: pilke
  labels:
    app: pilke-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: pilke-migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: migrate
          image: ghcr.io/boissit/treffit-backend:sha-1540b01
          command:
            - sh
            - -c
            - |
              set -e
              python manage.py migrate --noinput
              # NOT a migration, and `makemigrations --check` will never notice
              # it missing. CACHES is a database cache and the first write
              # against a missing table raises ProgrammingError — and that first
              # write is the login-code rate limit, so skipping this answers 500
              # to every caller the moment SMS is switched on. Idempotent, which
              # is why it belongs in every release rather than in somebody's
              # memory of the first one.
              python manage.py createcachetable
              # The venue catalogue (pilke-app#53), on exactly `createcachetable`'s
              # reasoning: idempotent, and it belongs in every release rather than
              # in somebody's memory of the first one. An `Activity` table this
              # deployment forgot is not a visible failure — `GET /api/candidates`
              # filters on venue overlap, so every draw would answer its ordinary
              # 404 "nobody compatible" for every user for ever, which reads as a
              # matching problem rather than as missing content.
              #
              # ⚠️ The catalogue in `core/venues.py` is the authority, so a re-run
              # re-asserts it: a venue's date categories are set back to the
              # catalogue's on every deploy, and a catalogue venue deleted by hand
              # comes back. Venues *outside* the catalogue are left alone and
              # reported. Editing a catalogue venue is therefore a code change,
              # which is the point of it being in code.
              #
              # It refuses rather than half-writes: a duplicate name, a bad price
              # band or a row with no category is reported before anything is
              # written, and a seeded venue that ends up with no categories rolls
              # the transaction back. A failure here fails the Argo sync and leaves
              # the old pods serving, which is the behaviour this Job is for.
              python manage.py seed_venues
          envFrom:
            - configMapRef:
                name: pilke-config
            - secretRef:
                name: pilke-app-secrets
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: pilke-postgres-user
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pilke-postgres-user
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
