# ⚠️ NOT IN kustomization.yaml YET, ON PURPOSE. See the note there.
#
# This file is the moment the API becomes reachable from the internet, and
# POST /api/auth/login returns the one-time login code in its response body for
# as long as SMS_BACKEND is unset. Adding this without setting SMS_BACKEND in
# the same commit publishes an account-takeover hole to anybody who knows a
# registered phone number.
#
# Let's Encrypt solves HTTP-01 through nginx, so api.pilke.app has to resolve
# publicly before the certificate can issue: add --domain-filter=pilke.app to
# external-dns and confirm the CNAME onto boiss.it first, then commit this.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pilke-ingress
  namespace: pilke
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  tls:
    - secretName: pilke-tls
      hosts:
        - api.pilke.app
  rules:
    - host: api.pilke.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pilke-api
                port:
                  name: http
