apiVersion: apps/v1
kind: Deployment
metadata:
  name: pilke-api
  namespace: pilke
  labels:
    app: pilke-api
spec:
  # Two, and a rolling upgrade. These pods hold no volume at all now, so there
  # is nothing to pin them to a node and nothing to detach before one moves.
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: pilke-api
  template:
    metadata:
      labels:
        app: pilke-api
    spec:
      # No volumes: these pods write nothing to disk. Photographs go to Garage
      # over S3, sessions and the task queue are in Postgres, and the collected
      # static is baked into the image.
      #
      # `runAsNonRoot` needs no `runAsUser` beside it: the image's `USER` is
      # numeric (1000:1000, pinned in the Dockerfile), which is the only thing
      # the kubelet can check. It refuses to start a container whose image names
      # its user, so this pairing is what the image was changed for.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: api
          # ⚠️ THIS TAG AND THE COMMAND BELOW ARE ONE CHANGE. The command names
          # `gunicorn.conf.py`, which exists only in an image built from the
          # commit that added telemetry to the backend. Bump this tag in the same
          # commit that changes the command, or gunicorn exits immediately with
          # a config file it cannot find and the API is down. CI does not build
          # this image — see ../README.md and treffit-backend/docs/releasing.md.
          image: ghcr.io/boissit/treffit-backend:sha-d7cff22
          # The Dockerfile's CMD takes gunicorn's default of **one** worker,
          # which is one request at a time per pod. Fine for `docker compose` on
          # a laptop and not for the only API a beta has. Sync workers: reads of
          # photographs never reach this process, and an upload is one PUT.
          command:
            - gunicorn
            # ⚠️ `-c gunicorn.conf.py` IS WHAT KEEPS THIS PROCESS FROM HANGING,
            # not a tidier way to pass options. That file's `post_fork` is where
            # telemetry is initialised, and it has to be after the fork:
            # OpenTelemetry's `BatchSpanProcessor` starts a background thread,
            # which is not fork-safe, so a provider built in the master process
            # leaves each worker holding an inherited lock. The symptom is a
            # worker that hangs on its first request rather than an error, so
            # nothing in the logs points at this.
            #
            # The file lives at /app/gunicorn.conf.py in the image, which is the
            # working directory, so the bare name resolves.
            - -c
            - gunicorn.conf.py
            - treffit_backend.wsgi:application
            - --bind
            - 0.0.0.0:8000
            - --workers
            - "3"
          envFrom:
            - configMapRef:
                name: pilke-config
            - secretRef:
                name: pilke-app-secrets
          env:
            # ⚠️ HERE AND NOT IN `pilke-config`. Three Deployments share that
            # ConfigMap and need three different names; set it there and the
            # API, the worker and the scheduler arrive as one service with
            # their error rates added together. The name also has to match what
            # the log pipeline derives from the container name, `pilke-` plus
            # `api`, or the trace-to-logs click lands nowhere.
            - name: OTEL_SERVICE_NAME
              value: pilke-api
            # The image's own revision, handed back to the process that is running
            # it. Nothing inside a container can read its own OCI labels, so
            # `service.version` on every span comes from here or not at all — and
            # without it "which build broke" is a question the traces cannot
            # answer. It has to be bumped with `image:` above; the two are one
            # edit, and a stale value here is worse than an absent one because it
            # attributes a new build's errors to an old release.
            - name: SERVICE_VERSION
              value: sha-ec3e1a9
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: pilke-postgres-user
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pilke-postgres-user
                  key: password
          ports:
            - name: http
              containerPort: 8000
          # The Host header is required: a probe otherwise arrives with the pod
          # IP, ALLOWED_HOSTS answers 400, and the pod never becomes ready.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 10
            periodSeconds: 10
          # Deliberately not /healthz. That endpoint checks the database, and a
          # database-dependent liveness probe turns a Postgres outage into a
          # restart loop that helps nobody. Readiness pulling the pod out of the
          # Service is the correct response to the same condition.
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
      restartPolicy: Always
