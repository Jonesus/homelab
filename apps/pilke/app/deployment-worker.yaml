# Executes the queue. `settings.TASKS` uses django_tasks_db, so the queue is
# a Postgres table and this is the only thing that drains it. Without it no push
# notification is ever sent and the outbox fills silently, because a filling
# outbox is a valid state.
#
# Tasks are claimed with SELECT ... FOR UPDATE SKIP LOCKED, so more replicas are
# safe. One drains a 1-minute outbox comfortably at beta size; scale up the day
# a drain takes longer than a minute.
#
# No media mount: nothing either process runs touches image files today. That
# changes when account deletion starts unlinking photographs from a task.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pilke-worker
  namespace: pilke
  labels:
    app: pilke-worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pilke-worker
  template:
    metadata:
      labels:
        app: pilke-worker
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: worker
          # ⚠️ THIS TAG AND THE COMMAND BELOW ARE ONE CHANGE. The command names
          # `opentelemetry-instrument`, which is on PATH only in an image built
          # from the commit that added `opentelemetry-distro` to the backend's
          # dependencies. Bump this tag in the same commit that changes the
          # command, or the container exits with "executable file not found".
          # CI does not build this image — see ../README.md and
          # treffit-backend/docs/releasing.md.
          image: ghcr.io/boissit/treffit-backend:sha-6a6d9d3
          # `opentelemetry-instrument` is the zero-code path, and it is the
          # simplest correct one here because this process does not fork. The
          # API cannot use it: gunicorn forks, and a `BatchSpanProcessor` built
          # before the fork deadlocks the worker, so that Deployment initialises
          # telemetry in `post_fork` instead.
          command: ["opentelemetry-instrument", "python", "manage.py", "db_worker"]
          envFrom:
            - configMapRef:
                name: pilke-config
            - secretRef:
                name: pilke-app-secrets
          env:
            # ⚠️ HERE AND NOT IN `pilke-config`. Three Deployments share that
            # ConfigMap and need three different names; set it there and all
            # three processes arrive as one service. The name also has to match
            # what the log pipeline derives from the container name, `pilke-`
            # plus `worker`, or a span and the log line beside it look like two
            # different services.
            - name: OTEL_SERVICE_NAME
              value: pilke-worker
            # The image's own revision, handed back to the process that is running
            # it. Nothing inside a container can read its own OCI labels, so
            # `service.version` on every span comes from here or not at all — and
            # without it "which build broke" is a question the traces cannot
            # answer. It has to be bumped with `image:` above; the two are one
            # edit, and a stale value here is worse than an absent one because it
            # attributes a new build's errors to an old release.
            - name: SERVICE_VERSION
              value: sha-553a71b
            # ⚠️ The API does not need this and these two do. `telemetry.py`
            # builds the Resource, reads SERVICE_VERSION and puts
            # service.version on every span -- but only on the gunicorn path,
            # where `post_fork` calls it. These two start under
            # `opentelemetry-instrument`, whose distro builds the Resource from
            # the standard variables before our code is reached, and
            # SERVICE_VERSION is a name we invented, so it is ignored. Without
            # this line their spans carry no version at all and "which build
            # broke" is unanswerable for two thirds of the processes.
            #
            # $(SERVICE_VERSION) rather than a repeated literal: Kubernetes
            # expands one env var into another, so the tag above stays the one
            # place it is written per Deployment.
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.version=$(SERVICE_VERSION)"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: pilke-postgres-user
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pilke-postgres-user
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
      restartPolicy: Always
