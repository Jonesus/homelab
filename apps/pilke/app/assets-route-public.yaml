# ⚠️ NOT IN kustomization.yaml YET. It travels with ingress.yaml — the same
# commit, for the same reason. See the note there.
#
# The public half of `assets-route.yaml`; everything about how it works is
# explained there. **This is the host presigned URLs name**, so this is the one
# that has to preserve the Host and the path.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pilke-ingress-assets-public
  namespace: pilke
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # No `upstream-vhost` and no `rewrite-target`, and their absence is
    # load-bearing: a presigned request's signature covers the Host and the path.
    # `assets-route.yaml` argues both at length.
    nginx.ingress.kubernetes.io/service-upstream: "true"
spec:
  ingressClassName: nginx
  tls:
    - secretName: pilke-tls
      hosts:
        - api.pilke.app
  rules:
    - host: api.pilke.app
      http:
        paths:
          - path: /assets
            pathType: Prefix
            backend:
              service:
                name: pilke-assets
                port:
                  name: s3
