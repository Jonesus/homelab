# Garage, single node: an S3-compatible store for Pilke's profile photographs.
#
# Chosen over MinIO because MinIO's upstream was archived in February 2026 —
# what is left is community forks — and over SeaweedFS because that is a
# four-component deployment for a job this size. Garage is one binary, 512Mi,
# and one volume.
#
# ⚠️ A fresh install does nothing until its layout is assigned by hand. See the
# bootstrap steps in apps/garage/README.md; until then every S3 call fails in a
# way that looks like a broken credential.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: garage
  namespace: garage
  labels:
    app: garage
spec:
  serviceName: garage
  replicas: 1
  selector:
    matchLabels:
      app: garage
  template:
    metadata:
      labels:
        app: garage
    spec:
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: garage
          image: dxflrs/garage:v2.3.0
          env:
            - name: GARAGE_RPC_SECRET
              valueFrom:
                secretKeyRef:
                  name: garage-secrets
                  key: rpc-secret
            - name: GARAGE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: garage-secrets
                  key: admin-token
            - name: TZ
              value: Europe/Helsinki
          ports:
            - name: s3
              containerPort: 3900
            - name: rpc
              containerPort: 3901
            - name: web
              containerPort: 3902
            - name: admin
              containerPort: 3903
          # The admin API answers before a layout exists, which is what we want:
          # the pod is up, and the bootstrap is a separate thing that has or has
          # not been done. `/health` on the S3 port would keep it unready for
          # ever on a fresh install.
          readinessProbe:
            httpGet:
              path: /health
              port: 3903
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3900
            initialDelaySeconds: 20
            periodSeconds: 30
          volumeMounts:
            - name: config
              mountPath: /etc/garage.toml
              subPath: garage.toml
              readOnly: true
            - name: data
              mountPath: /var/lib/garage
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: config
          configMap:
            name: garage
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: iscsi
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 30Gi
