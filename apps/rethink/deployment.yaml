apiVersion: apps/v1
kind: Deployment
metadata:
  name: rethink
  namespace: homeassistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rethink
  template:
    metadata:
      labels:
        app: rethink
    spec:
      containers:
        - name: rethink
          # ghcr.io/anszom/rethink has only a `:dev` tag — no `:latest` is
          # published (no stable release has been cut as of 2026-05).
          # `:dev` is a mutable rolling tag (rebuilt on every push to
          # anszom/rethink master), so always re-pull to track mainline.
          image: ghcr.io/anszom/rethink:dev
          imagePullPolicy: Always
          ports:
            - containerPort: 4433
              name: thinq2-https
            - containerPort: 46030
              name: thinq1-https
            - containerPort: 47878
              name: thinq1-tls
            - containerPort: 44401
              name: management
          volumeMounts:
            # rethink-cloud reads /app/config.json (its working dir is /app)
            # and ignores anything at /config — subPath-mount to overwrite
            # the image's default in-place.
            - mountPath: /app/config.json
              subPath: config.json
              name: config
              readOnly: true
            # NOTE: the LG washer/dryer combo (CV74J7S2QA → F_VB_F___W.B_2QEUK)
            # handler was mainlined into anszom/rethink, so it now ships in the
            # `:dev` image — the previous ha_bridge.js / device-handler overlays
            # have been removed.
            - mountPath: /state
              name: state
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: rethink-config
        - name: state
          persistentVolumeClaim:
            claimName: rethink-state-pvc
