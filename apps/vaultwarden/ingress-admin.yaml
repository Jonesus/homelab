# The vault itself stays public on vault.boiss.it; only the admin page answers the
# LAN alone. A separate Ingress for the same host, because ingress-nginx applies an
# allowlist per Ingress and the longer /admin prefix wins over / for its paths.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vaultwarden-ingress-admin
  namespace: vaultwarden
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/allowlist-source-range: "192.168.0.0/16,10.0.0.0/8"
spec:
  ingressClassName: nginx
  tls:
    - secretName: vaultwarden-tls
      hosts:
        - vault.boiss.it
  rules:
    - host: vault.boiss.it
      http:
        paths:
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: vaultwarden
                port:
                  name: http
