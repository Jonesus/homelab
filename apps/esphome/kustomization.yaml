apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: homeassistant

resources:
  - persistentvolumeclaim.yaml
  - deployment.yaml
  - service.yaml
  - ingress-internal.yaml
  - secrets.sealed.yaml

# Device YAMLs are GitOps-managed: kustomize hashes the ConfigMap name, so
# editing a file here rolls the Deployment and the dashboard picks up the new
# config. Files mounted this way are read-only in the web UI by design.
configMapGenerator:
  - name: esphome-devices
    files:
      - ir-blaster-livingroom.yaml=config/ir-blaster-livingroom.yaml
