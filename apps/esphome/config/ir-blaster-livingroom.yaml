# Tuya generic WiFi IR remote control — CB3S module (Beken BK7231N).
# Stock firmware removed with tuya-cloudcutter using device profile
# `tuya-generic-universal-ir-remote-control-cb3s-v2.0.0`.
#
# Pin map determined empirically; the published sources disagree and mostly
# lose. devices.esphome.io says receive P7 / LED P8, the cloudcutter profile's
# stock-firmware config says infrr=24 / wfst_pin=7 — a diagnostic build
# listening on eleven GPIOs at once proved receive is P8 and nothing else.
# That vindicated a third mapping (P7 send, P8 receive, P24/P26 WiFi LED),
# which is why transmit is P7 here: transmitting on P26 fired the action but
# emitted nothing the device's own receiver could hear. P6 button is the one
# thing every source agrees on.

substitutions:
  name: ir-blaster-livingroom
  friendly_name: Living Room IR Blaster

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

bk72xx:
  board: cb3s

logger:

api:
  encryption:
    key: !secret ir_blaster_livingroom_api_key
  actions:
    # Send a raw IR frame: alternating positive (mark) / negative (space)
    # microsecond durations, exactly as remote_receiver dumps them.
    - action: send_raw
      variables:
        code: int[]
      then:
        - remote_transmitter.transmit_raw:
            code: !lambda "return code;"

    # Send a Pronto hex string, the format used by most online IR code
    # databases and by HA's own `remote.send_command` payloads.
    - action: send_pronto
      variables:
        data: string
      then:
        - remote_transmitter.transmit_pronto:
            data: !lambda "return data;"

ota:
  - platform: esphome
    password: !secret ir_blaster_livingroom_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Fallback AP so the device stays reachable if WiFi credentials go stale.
  # Recovering over serial means opening the case, so keep this.
  ap:
    ssid: ${name}-fallback
    password: !secret ir_blaster_livingroom_ota_password

captive_portal:

remote_receiver:
  pin:
    number: P8
    inverted: true
    mode: INPUT_PULLUP
  # Learning codes off an existing remote means reading these logs. `raw` is
  # the one that always works — exact microsecond timings, replayable through
  # the send_raw action whatever the protocol turns out to be — so it stays
  # even though the named decoders are prettier when they do fire. rc_switch is
  # deliberately absent: it "decodes" IR noise into all-zero payloads.
  dump:
    - raw
    - nec
    - samsung
    - samsung36
    - sony
    - panasonic
    - jvc
    - lg
    - rc5
    - pronto
  # 4ms was splitting single presses into three fragments — this protocol has
  # gaps between its bursts. 20ms keeps a press together as one frame, and the
  # bigger buffer holds it.
  tolerance: 55%
  filter: 10us
  idle: 20ms
  buffer_size: 4kb

remote_transmitter:
  pin: P7
  carrier_duty_percent: 50%

light:
  - platform: status_led
    name: Status LED
    pin: P26
    entity_category: diagnostic

binary_sensor:
  - platform: gpio
    name: Button
    pin:
      number: P6
      inverted: true
      mode:
        input: true
        pullup: true

# LED candle remote — NEC, address 0xFF00, captured off the physical remote.
# Brightness is step-only: the remote sends "one step brighter/dimmer" and the
# candles report nothing back, so there is deliberately no level tracking here
# and no light entity pretending to know a brightness. Four honest buttons.
button:
  - platform: template
    name: Candles On
    icon: mdi:candle
    on_press:
      - remote_transmitter.transmit_nec:
          address: 0xFF00
          command: 0xFF00

  - platform: template
    name: Candles Off
    icon: mdi:candle
    on_press:
      - remote_transmitter.transmit_nec:
          address: 0xFF00
          command: 0xFD02

  - platform: template
    name: Candles Brighter
    icon: mdi:brightness-plus
    on_press:
      - remote_transmitter.transmit_nec:
          address: 0xFF00
          command: 0xED12

  - platform: template
    name: Candles Dimmer
    icon: mdi:brightness-minus
    on_press:
      - remote_transmitter.transmit_nec:
          address: 0xFF00
          command: 0xEF10

sensor:
  - platform: wifi_signal
    name: WiFi Signal
    update_interval: 60s
    entity_category: diagnostic
