apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: democratic-csi
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: democratic-csi
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: democratic-csi
    repoURL: https://democratic-csi.github.io/charts/
    targetRevision: 0.15.0
    helm:
      releaseName: democratic-csi
      valuesObject:
        csiDriver:
          name: "iscsi"
        controller:
          driver:
            enabled: true
            # ⚠️ A RELEASE, PINNED BY DIGEST, and the same one as the node plugin
            # below. A floating tag (`next`, `latest`) is pulled afresh whenever
            # a pod lands on a node that has not cached it, so a node drain can
            # swap the storage driver for whatever was published that week; a
            # `next` that refused the API key over plain http once stopped every
            # iSCSI volume attaching. Bump both together, after a throwaway PVC
            # has been provisioned, attached and written with the new one.
            image:
              registry: docker.io/democraticcsi/democratic-csi
              tag: v1.9.5@sha256:fc3b7d7ed3a616714139525075312758e23a5d425ffb539ad12c9bd20fb6001f
        node:
          hostPID: true
          driver:
            # The controller's release, for the controller's reason: this
            # restarts with every node reboot, and the chart pulls `Always`.
            image:
              registry: docker.io/democraticcsi/democratic-csi
              tag: v1.9.5@sha256:fc3b7d7ed3a616714139525075312758e23a5d425ffb539ad12c9bd20fb6001f
            extraEnv:
              - name: ISCSIADM_HOST_STRATEGY
                value: nsenter
              - name: ISCSIADM_HOST_PATH
                value: /usr/local/sbin/iscsiadm
            iscsiDirHostPath: /var/iscsi
            iscsiDirHostPathType: ""
        storageClasses:
        - name: iscsi
          defaultClass: false
          reclaimPolicy: Delete
          volumeBindingMode: Immediate
          allowVolumeExpansion: true
          parameters:
            fsType: ext4
            detachedVolumesFromSnapshots: "false"
          mountOptions: []
          secrets:
            provisioner-secret:
            controller-publish-secret:
            node-stage-secret:
            node-publish-secret:
            controller-expand-secret:
        volumeSnapshotClasses:
        - name: iscsi
          parameters:
            detachedSnapshots: "true"
        driver:
          existingConfigSecret: iscsi-config
          config:
            driver: freenas-api-iscsi
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/audit: privileged
        pod-security.kubernetes.io/warn: privileged
